<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>System monitor</title>

  <defs>
    <linearGradient id="starkPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282E"/>
      <stop offset="1" stop-color="#18191D"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect x="8" y="8" width="240" height="240" rx="52" fill="#18191D"/>
    <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#starkPlate)"/>
  </g>

  <g id="surface">
    <rect x="40" y="56" width="176" height="144" rx="26" fill="#18191D"/>
  </g>

  <g id="frame">
    <rect x="12" y="12" width="232" height="232" rx="48" fill="none" stroke="#343842" stroke-width="4"/>
    <rect x="40" y="56" width="176" height="144" rx="26" fill="none" stroke="#343842" stroke-width="4"/>
    <path d="M 64 170 H 192" stroke="#343842" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g id="symbol">
    <path d="M 64 150 L 92 150 L 110 104 L 132 164 L 150 128 L 166 128"
          fill="none" stroke="#EBE8E2" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="accent">
    <path d="M 166 128 H 192" stroke="#D6A84E" stroke-width="16" stroke-linecap="round"/>
    <circle cx="110" cy="104" r="12" fill="#D6A84E"/>
  </g>

  <g id="highlight">
    <path d="M 58 14 H 198" stroke="#EBE8E2" stroke-width="4" stroke-linecap="round" opacity="0.1"/>
  </g>
</svg>
